# Runs loadgen/script.js inside the cluster against the in-cluster Services.
# Created by `make load-job`, which also creates the two ConfigMaps it reads.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: otel-play
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:1.8.2
          args: ["run", "--quiet", "/scripts/script.js"]
          env:
            - name: SHOP_URL
              value: http://web
            - name: ORDERS_URL
              value: http://orders-api
            - name: CATALOGUE_URL
              value: http://catalogue-api
          envFrom:
            # VUS and DURATION
            - configMapRef:
                name: loadgen-env
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: loadgen-script
