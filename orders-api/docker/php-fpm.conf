[global]
; Laravel already logs each request as JSON; fpm's own lines would be noise.
log_level = warning

[www]
; Pass the pod's environment (DB_HOST, REDIS_HOST, ...) through to PHP.
clear_env = no
; The official image sends the access log to stderr in a non-JSON format.
access.log = /dev/null

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
