apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orders-api.fullname" . }}
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "orders-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "orders-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: php
          image: {{ include "orders-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orders-api.fullname" . }}-app-key
                  key: app-key
            {{- include "orders-api.env" . | nindent 12 }}
          ports:
            - name: fastcgi
              containerPort: 9000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsUser: 33 # www-data
            runAsGroup: 33
            allowPrivilegeEscalation: false
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          # /up is Laravel's health route, so these probes check php-fpm too.
          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          securityContext:
            runAsUser: 101 # nginx
            allowPrivilegeEscalation: false
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "orders-api.fullname" . }}-nginx
