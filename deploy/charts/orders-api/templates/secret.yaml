{{- /* Generate APP_KEY once and keep it across upgrades. */ -}}
{{- $name := printf "%s-app-key" (include "orders-api.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  app-key: {{ index $existing.data "app-key" }}
  {{- else }}
  app-key: {{ printf "base64:%s" (randAscii 32 | b64enc) | b64enc }}
  {{- end }}
