image:
  repository: otel-play/web
  tag: dev
  # Images are loaded into k3d with `k3d image import`, never pulled.
  pullPolicy: IfNotPresent

replicas: 1
port: 3000

app:
  # Server-side calls to catalogue-api stay inside the cluster.
  catalogueUrl: http://catalogue-api
  # The browser calls orders-api directly, so this must be reachable from
  # the user's machine.
  ordersPublicUrl: http://orders.localhost

# Extra environment variables, as a name -> value map.
env: {}

# `make deploy-web` sets a timestamp here so a re-imported image with the
# same tag still rolls the pod.
podAnnotations: {}

ingress:
  enabled: true
  className: traefik
  host: shop.localhost

resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 256Mi
