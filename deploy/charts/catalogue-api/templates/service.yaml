apiVersion: v1
kind: Service
metadata:
  name: {{ include "catalogue-api.fullname" . }}
  labels:
    {{- include "catalogue-api.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "catalogue-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
