apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "catalogue-api.fullname" . }}-data
  labels:
    {{- include "catalogue-api.labels" . | nindent 4 }}
  annotations:
    # Keep the product data if the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
